[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Show local variables on failure for easier debugging, skip heavy live neural-network inference by default
addopts = -v --tb=short -m "not live_ocr and not live_llm and not live_document_ai and not live_asr and not live_voice_pipeline"
markers =
    no_auto_ocr_mock: marks tests that test raw OCR client and bypass conftest autouse mock
    live_ocr: marks integration tests that perform real local neural-network inference (run explicitly with -m live_ocr)
    live_llm: marks integration tests that call a real LLM provider (requires LLM_API_KEY env var, run explicitly with -m live_llm)
    live_document_ai: marks end-to-end tests that run real OCR + real LLM on a document image (requires both providers, run explicitly with -m live_document_ai)
    live_asr: marks integration tests that call a real ASR provider (requires LLM_API_KEY env var, run explicitly with -m live_asr)
    live_voice_pipeline: marks end-to-end voice intake tests using real ASR + real LLM (run explicitly with -m live_voice_pipeline)

